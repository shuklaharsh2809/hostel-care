<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" fill="none">
  <!-- Original illustration for HostelCare. Free to use. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5f5e8"/>
      <stop offset="1" stop-color="#eefbf6"/>
    </linearGradient>
    <linearGradient id="bldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1ca585"/>
      <stop offset="1" stop-color="#0f856c"/>
    </linearGradient>
    <linearGradient id="bldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e5448"/>
      <stop offset="1" stop-color="#0d453c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0d453c" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="520" height="400" rx="36" fill="url(#sky)"/>
  <circle cx="455" cy="92" r="34" fill="#fbbf4a"/>
  <circle cx="455" cy="92" r="50" fill="#fbbf4a" opacity="0.18"/>
  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <rect x="70" y="70" width="90" height="22" rx="11"/>
    <rect x="95" y="58" width="44" height="22" rx="11"/>
    <rect x="330" y="130" width="70" height="18" rx="9"/>
  </g>
  <!-- ground -->
  <path d="M20 360 H540 V384 A36 36 0 0 1 504 420 H56 A36 36 0 0 1 20 384 Z" fill="#aeead5"/>
  <!-- back building (branch 2) -->
  <g>
    <rect x="320" y="190" width="130" height="172" rx="6" fill="url(#bldB)"/>
    <rect x="312" y="180" width="146" height="16" rx="4" fill="#0d6a58"/>
    <g fill="#78d9bc" opacity="0.85">
      <rect x="338" y="212" width="22" height="26" rx="3"/><rect x="374" y="212" width="22" height="26" rx="3"/><rect x="410" y="212" width="22" height="26" rx="3"/>
      <rect x="338" y="254" width="22" height="26" rx="3"/><rect x="374" y="254" width="22" height="26" rx="3" fill="#fbbf4a"/><rect x="410" y="254" width="22" height="26" rx="3"/>
      <rect x="338" y="296" width="22" height="26" rx="3" fill="#fbbf4a"/><rect x="410" y="296" width="22" height="26" rx="3"/>
    </g>
    <rect x="372" y="324" width="26" height="38" rx="3" fill="#052722"/>
  </g>
  <!-- main building -->
  <g>
    <rect x="130" y="140" width="200" height="222" rx="8" fill="url(#bldA)"/>
    <path d="M118 146 L230 96 L342 146 Z" fill="#0d6a58"/>
    <rect x="200" y="112" width="60" height="22" rx="4" fill="#fff"/>
    <text x="230" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0d6a58">HOSTEL</text>
    <g fill="#eefbf6">
      <rect x="152" y="166" width="30" height="32" rx="4"/><rect x="198" y="166" width="30" height="32" rx="4" fill="#fbbf4a"/><rect x="244" y="166" width="30" height="32" rx="4"/><rect x="290" y="166" width="22" height="32" rx="4"/>
      <rect x="152" y="216" width="30" height="32" rx="4" fill="#fbbf4a"/><rect x="198" y="216" width="30" height="32" rx="4"/><rect x="244" y="216" width="30" height="32" rx="4"/><rect x="290" y="216" width="22" height="32" rx="4" fill="#fbbf4a"/>
      <rect x="152" y="266" width="30" height="32" rx="4"/><rect x="244" y="266" width="30" height="32" rx="4" fill="#fbbf4a"/><rect x="290" y="266" width="22" height="32" rx="4"/>
    </g>
    <rect x="196" y="304" width="44" height="58" rx="4" fill="#052722"/>
    <circle cx="232" cy="334" r="2.5" fill="#fbbf4a"/>
    <rect x="186" y="298" width="64" height="8" rx="3" fill="#0d6a58"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="78" y="318" width="8" height="44" rx="3" fill="#8a5a2b"/>
    <circle cx="82" cy="304" r="28" fill="#1ca585"/>
    <circle cx="70" cy="318" r="16" fill="#0f856c"/>
    <rect x="482" y="324" width="7" height="38" rx="3" fill="#8a5a2b"/>
    <circle cx="486" cy="312" r="22" fill="#40c09e"/>
  </g>
  <!-- people -->
  <g>
    <circle cx="282" cy="318" r="9" fill="#f2c39b"/>
    <path d="M272 312 a10 10 0 0 1 20 0 v-2 h-20z" fill="#262c31"/>
    <rect x="273" y="328" width="18" height="24" rx="6" fill="#f5a524"/>
    <rect x="275" y="350" width="6" height="12" rx="2" fill="#262c31"/><rect x="284" y="350" width="6" height="12" rx="2" fill="#262c31"/>
    <rect x="289" y="332" width="10" height="14" rx="2" fill="#0d6a58"/>
    <circle cx="112" cy="322" r="8" fill="#c98e63"/>
    <path d="M103 320 q9 -14 18 0 v6 h-18z" fill="#3e464d"/>
    <rect x="104" y="331" width="16" height="22" rx="6" fill="#4f9cf0"/>
    <rect x="106" y="351" width="5" height="11" rx="2" fill="#262c31"/><rect x="113" y="351" width="5" height="11" rx="2" fill="#262c31"/>
  </g>
  <!-- floating invoice card -->
  <g filter="url(#shadow)">
    <rect x="384" y="300" width="150" height="104" rx="14" fill="#fff"/>
    <text x="400" y="326" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#171b1f">Invoice #000124</text>
    <rect x="400" y="338" width="80" height="6" rx="3" fill="#dde1e3"/>
    <rect x="400" y="352" width="60" height="6" rx="3" fill="#dde1e3"/>
    <text x="400" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f856c">₹11,500</text>
    <rect x="474" y="373" width="46" height="18" rx="9" fill="#d5f5e8"/>
    <text x="497" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0d6a58">PAID</text>
  </g>
  <!-- floating student card -->
  <g filter="url(#shadow)">
    <rect x="34" y="150" width="140" height="70" rx="14" fill="#fff"/>
    <circle cx="62" cy="185" r="16" fill="#d5f5e8"/>
    <text x="62" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0d6a58">AS</text>
    <rect x="86" y="174" width="70" height="7" rx="3.5" fill="#262c31"/>
    <rect x="86" y="189" width="50" height="6" rx="3" fill="#c3c9cd"/>
  </g>
</svg>
